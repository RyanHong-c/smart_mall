spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 1813745788
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8080
        port: 8721
      eager: true

rocketmq:
  name-server: localhost:9876
  producer:
    group: order-producer-group
    send-message-timeout: 3000

feign:
  sentinel:
    enabled: true

# ============================================
# Seata 分布式事务配置
# AT 模式：自动记录 undo_log，回滚时自动补偿
# ============================================
seata:
  tx-service-group: smartmall-tx-group
  service:
    vgroup-mapping:
      smartmall-tx-group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file
    file:
      name: seata.properties

server:
  port: 8087

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans